name: Build Pulse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3)
            os: windows-latest
          - name: macOS (VST3 + AU)
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # ---------------------------------------------------------------- Windows
      - name: Upload Windows VST3
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-VST3
          path: build/Pulse_artefacts/Release/VST3/Pulse.vst3
          if-no-files-found: error

      # ------------------------------------------------------------------ macOS
      - name: Ad-hoc sign and zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/Pulse_artefacts/Release
          codesign --force --deep --sign - VST3/Pulse.vst3
          codesign --force --deep --sign - AU/Pulse.component
          zip -r -y "$GITHUB_WORKSPACE/Pulse-macOS.zip" VST3/Pulse.vst3 AU/Pulse.component

      - name: Upload macOS VST3 + AU
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-macOS-VST3-AU
          path: Pulse-macOS.zip
          if-no-files-found: error
